name: Release

# Push a tag like v0.1.0 (it must match pkgver in packaging/PKGBUILD).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pkgver
        run: |
          ver=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != PKGBUILD pkgver v$ver"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.pkg.tar.zst | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
