# monarchy-encryption: a systemd initramfs, which TPM unlock needs. Sorts after Omarchy's drop-ins and maps their
# busybox hooks to the systemd equivalents, so Omarchy's own changes to the list (kms on NVIDIA, new hooks) carry over.
# The disk is described by /etc/crypttab.initramfs; cryptdevice= on the command line is then ignored, and kept for
# Omarchy's tools that read it.
_me_hooks=()
for _me_hook in "${HOOKS[@]}"; do
  case $_me_hook in
    udev) _me_hooks+=(systemd) ;;
    # Omarchy bundles the console layout only when it types Latin letters (a passphrase is Latin); follow its decision
    keymap) [[ " ${FILES[*]:-} " == *" /etc/vconsole.conf "* ]] && _me_hooks+=(sd-vconsole) ;;
    consolefont) ;;                                    # sd-vconsole does the font too
    encrypt) _me_hooks+=(sd-encrypt) ;;
    btrfs-overlayfs) _me_hooks+=(sd-btrfs-overlayfs) ;;  # booting a read-only snapshot
    resume) ;;                                         # systemd resumes from hibernation itself
    *) _me_hooks+=("$_me_hook") ;;
  esac
done
HOOKS=("${_me_hooks[@]}")
unset _me_hooks _me_hook
