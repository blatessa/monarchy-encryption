# managed by monarchy-encryption: a systemd initramfs, which unlocking the disk with the TPM needs.
# Sorts after Omarchy's drop-ins and maps their busybox hooks to the systemd ones, so whatever else Omarchy decides about
# the list (no kms on NVIDIA-only machines, new hooks) carries over. The disk is opened from /etc/crypttab
# (x-initrd.attach); cryptdevice= on the kernel command line is ignored by systemd and kept for Omarchy's tools.
_me_hooks=()
for _me_hook in "${HOOKS[@]}"; do
  case $_me_hook in
    udev) _me_hooks+=(systemd) ;;
    keymap)
      # Omarchy bundles the console layout only when it types Latin letters, as a passphrase is Latin; sd-vconsole
      # would bundle any layout, so it follows Omarchy's decision
      if [[ " ${FILES[*]:-} " == *" /etc/vconsole.conf "* ]]; then _me_hooks+=(sd-vconsole); fi ;;
    consolefont) ;;                                       # sd-vconsole sets the font too
    encrypt) _me_hooks+=(sd-encrypt) ;;
    btrfs-overlayfs) _me_hooks+=(sd-btrfs-overlayfs) ;;   # booting a read-only snapshot
    resume) ;;                                            # systemd resumes from hibernation itself
    *) _me_hooks+=("$_me_hook") ;;
  esac
done
HOOKS=("${_me_hooks[@]}")
unset _me_hooks _me_hook
